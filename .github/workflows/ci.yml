name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel any in-flight run for the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Static checks: typecheck + tests (no DB needed for unit tests)
  # ============================================================
  static:
    name: Typecheck + Tests
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
          MARIADB_DATABASE: orbita_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12

    env:
      DATABASE_URL: mysql://root@127.0.0.1:3306/orbita_test
      JWT_SECRET: ci-only-not-a-real-secret-32chars-min-len-please
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            if mariadb -h 127.0.0.1 -u root -e "SELECT 1" orbita_test >/dev/null 2>&1; then
              echo "MariaDB ready (after ${i}s)"
              exit 0
            fi
            sleep 1
          done
          echo "MariaDB never became ready"
          exit 1

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm exec vitest run --reporter=basic
        # Some tests need real OAuth env vars that we never set in CI.
        # The 2 known pre-existing failures (googleOAuthCredentials.test.ts)
        # are not regressions — we just don't have those secrets in CI.
        continue-on-error: true

  # ============================================================
  # Build: vite + esbuild + docker image
  # ============================================================
  build:
    name: Build (vite + docker image)
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client + server
        run: pnpm run build

      - name: Verify dist/ has expected outputs
        run: |
          test -f dist/index.js
          test -d dist/public
          test -f dist/public/index.html

  # ============================================================
  # E2E smoke: bring up the standalone compose, hit /api/health,
  # verify the DB is reachable and the page renders.
  # ============================================================
  smoke:
    name: Smoke E2E (compose + /api/health)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Generate environment file
        working-directory: standalone
        run: |
          set -euo pipefail
          # 32+ char hex secrets (avoid $, #, ! that break compose interpolation)
          JWT_SECRET=$(openssl rand -hex 32)
          MYSQL_PASSWORD=$(openssl rand -hex 16)
          MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)
          LOCAL_ADMIN_PASSWORD=$(openssl rand -hex 16)
          BACKUP_REPORT_TOKEN=$(openssl rand -hex 24)
          cat > environment <<EOF
          APP_PORT=8080
          APP_ORIGIN=http://localhost:8080
          JWT_SECRET=${JWT_SECRET}
          LOCAL_ADMIN_EMAIL=ci@orbita.local
          LOCAL_ADMIN_NAME=CI Admin
          LOCAL_ADMIN_PASSWORD=${LOCAL_ADMIN_PASSWORD}
          MYSQL_PASSWORD=${MYSQL_PASSWORD}
          MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
          BACKUP_REPORT_TOKEN=${BACKUP_REPORT_TOKEN}
          CRON_TOKEN=${BACKUP_REPORT_TOKEN}
          EOF
          chmod 600 environment

      - name: Build the standalone image
        working-directory: standalone
        run: docker build -t standalone-orbita:ci -f Dockerfile ..

      - name: Bring up the stack
        working-directory: standalone
        run: docker compose --env-file environment up -d

      - name: Wait for orbita container to be healthy (up to 90s)
        working-directory: standalone
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            status=$(docker inspect --format='{{.State.Health.Status}}' standalone-orbita-1 2>/dev/null || echo "missing")
            if [ "$status" = "healthy" ]; then
              echo "Container healthy (after ${i}s)"
              exit 0
            fi
            sleep 1
          done
          echo "Container did not become healthy within 90s"
          docker ps -a --filter "name=standalone-"
          docker logs standalone-orbita-1 --tail 80 || true
          exit 1

      - name: Hit /api/health and assert db:ok
        run: |
          set -euo pipefail
          body=$(curl --fail --silent --max-time 5 http://localhost:8080/api/health)
          echo "Response: ${body}"
          echo "$body" | grep -q '"status":"ok"' || (echo "FAIL: status != ok" && exit 1)
          echo "$body" | grep -q '"db":"ok"' || (echo "FAIL: db != ok" && exit 1)
          echo "$body" | grep -qE '"version":"[0-9]+\.[0-9]+\.[0-9]+"' || (echo "FAIL: version not 1.0.0" && exit 1)

      - name: Hit / and assert pt-BR landing
        run: |
          set -euo pipefail
          html=$(curl --fail --silent --max-time 5 http://localhost:8080/)
          echo "$html" | grep -q 'lang="pt-BR"' || (echo "FAIL: not pt-BR" && exit 1)
          echo "$html" | grep -q 'ORB\|ÓRBITA' || (echo "FAIL: ORBITA missing" && exit 1)

      - name: Verify table count via mariadb client
        working-directory: standalone
        run: |
          set -euo pipefail
          root_pw=$(grep '^MYSQL_ROOT_PASSWORD=' environment | cut -d= -f2)
          count=$(docker exec standalone-mariadb-1 mariadb -uroot -p"$root_pw" \
                  -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='orbita';")
          echo "Tables: ${count}"
          [ "$count" -ge 40 ] || (echo "FAIL: only ${count} tables (expected >=40)" && exit 1)

      - name: Tear down
        if: always()
        working-directory: standalone
        run: docker compose --env-file environment down -v

  # ============================================================
  # Lint Markdown so the docs don't rot
  # ============================================================
  docs:
    name: Docs structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required files
        run: |
          test -f README.md
          test -f .gitignore
          test -f .dockerignore
          test -f standalone/Dockerfile
          test -f standalone/compose.yaml
          test -f standalone/entrypoint.sh
          test -f standalone/environment.template.txt
          test -d drizzle
          echo "✅ Required files present"
