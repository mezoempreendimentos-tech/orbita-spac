services:
  orbita:
    build:
      context: ..
      dockerfile: standalone/Dockerfile
    env_file: environment
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      PORT: 8080
      DATABASE_URL: mysql://orbita:${MYSQL_PASSWORD}@mariadb:3306/orbita
      AUTH_MODE: local
      VITE_AUTH_MODE: local
      STORAGE_DRIVER: local
      LOCAL_STORAGE_DIR: /var/lib/orbita/files
    volumes:
      - orbita_files:/var/lib/orbita
      # Volume mount do entrypoint - permite patch sem rebuild da imagem.
      # A imagem ja vem com o entrypoint original (3 linhas), mas este
      # aqui sobrepoe com a versao robusta (wait-for-db + tolerancia
      # a exit code do drizzle + validacao por estado do banco).
      # TODO longo prazo: bake no Dockerfile e remover o mount.
      - ./entrypoint.sh:/app/standalone/entrypoint.sh:ro
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    # Sobrescreve CMD/entrypoint do Dockerfile (apontando pro script
    # que veio via volume mount)
    entrypoint: ["sh", "/app/standalone/entrypoint.sh"]
    command: []
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: orbita
      MARIADB_USER: orbita
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - orbita_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  orbita_db:
  orbita_files:
