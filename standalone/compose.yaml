services:
  orbita:
    build:
      context: ..
      dockerfile: standalone/Dockerfile
    env_file: environment
    image: standalone-orbita:latest
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      PORT: 8080
      DATABASE_URL: mysql://orbita:${MYSQL_PASSWORD}@mariadb:3306/orbita
      AUTH_MODE: local
      VITE_AUTH_MODE: local
      STORAGE_DRIVER: local
      LOCAL_STORAGE_DIR: /var/lib/orbita/files
    volumes:
      - orbita_files:/var/lib/orbita
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      # GET /api/health retorna 200 quando o app subiu E o DB responde a SELECT 1.
      # Veja server/_core/health.ts. Intervalo conservador (15s) para nao martelar
      # o DB; start_period de 60s cobre o pior caso de cold start + migrations.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
    restart: unless-stopped
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: orbita
      MARIADB_USER: orbita
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - orbita_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  orbita_db:
  orbita_files:
